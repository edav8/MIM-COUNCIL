# Publish the static council site to GitHub Pages on every push to main.
#
# Both Emilie's and Tim's AI agents edit this repo; this is what turns a merge
# into a live change. Content lives in lib/events.ts and lib/council.ts — editing
# either one and pushing is the whole publish process.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild four times a day. The site is static, so which events count as
  # "upcoming" is decided when it is built.
  #
  # Once a day was not enough: GitHub's scheduler is best-effort and ran this
  # 8 hours late on both 4 and 5 November (12:54 and 13:04 UTC against a 05:10
  # cron), so the site showed the previous day's content every morning.
  # Four slots at an odd minute — on-the-hour crons queue worst — keeps the
  # calendar within a few hours even when a run is delayed or skipped.
  schedule:
    - cron: '23 3 * * *'
    - cron: '23 9 * * *'
    - cron: '23 15 * * *'
    - cron: '23 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24+, not 22: the generator imports lib/*.ts directly and Node only
          # strips TypeScript types without a flag from 23.6 onwards.
          node-version: '24'
      # No install step: the generator uses only the Node standard library,
      # so a broken or slow dependency can never block a publish.
      # The birthday list is not in the repository — this repo is public. It
      # lives in an Actions secret, written out just before the build and never
      # committed. With no secret set, the step is a no-op and no bar renders.
      - name: Restore the birthday list
        # The `secrets` context is not available in a step-level `if`, so the
        # empty case is handled in the shell instead. No secret, no file, no bar.
        run: |
          if [ -n "$BIRTHDAYS" ]; then
            printf '%s' "$BIRTHDAYS" > lib/birthdays.json
            echo "birthday list restored ($(wc -c < lib/birthdays.json) bytes)"
          else
            echo "no BIRTHDAYS secret set — the birthday bar will not render"
          fi
        env:
          BIRTHDAYS: ${{ secrets.BIRTHDAYS }}
      - name: Build the static site
        run: node tools/build-static.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
